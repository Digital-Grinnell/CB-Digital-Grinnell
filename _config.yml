##########
# collectionbuilder-csv
# Jekyll Digital Collection Generator
# https://github.com/CollectionBuilder/collectionbuilder-csv
##########

##########
# URL VARIABLES
#
# site domain, full URL to the production location of your collection.  
# was url: https://digitalcollections.lib.iastate.edu
url: "https://digitalgrinnell-secondary.z19.web.core.windows.net/"
# path to location on the domain if necessary e.g. /digital/hjccc
baseurl: "/tdps"
# URL of the root Digital Grinnell portal, used by the nav "Digital Grinnell" brand link.
# Leave blank on main (the portal itself). Set to the portal's absolute URL on every collection branch,
# so the brand link returns visitors to the portal instead of this collection's own homepage.
portal-url: "https://digitalgrinnell-secondary.z19.web.core.windows.net/"
# location of code, the full url to your github repository.  
# was source-code: https://github.com/isu-digital/digitalcollections.lib
source-code: https://github.com/Digital-Grinnell/CB-Digital-Grinnell

# url to the shared assets folder on mainweb.  
digital-assets: https://digitalgrinnell-secondary.z19.web.core.windows.net/assets

##########
# SITE SETTINGS
#
# title of site appears in banner.  
# was title: Digital Collections - Iowa State University Library
title: Digital Grinnell 
# tagline, a short phrase that will appear throughout the site in the top banner
tagline:
# description appears in meta tags and other locations
# this description might appear in search result lists, keep around 160 characters max
description: ""
# keywords, a short list of subjects describing the collection, separated by semicolon, to appear in rich markup.  
# was keywords: Iowa State University; digital collections; history; archival research
keywords: Grinnell College; digital collections; history; archival research
# creator of the digital collection, to appear in meta tags; we typically use our GitHub usernames but feel free to just use your name.  
# was author: isu-digital
author: Digital-Grinnell

##########
# COLLECTION SETTINGS
#
# Set the metadata for your collection (the name of the CSV file in your _data directory that describes the objects in your collection) 
# Use the filename of your CSV **without** the ".csv" extension! E.g. _data/demo-metadata.csv --> "demo-metadata"
metadata: tdps
# page generation settings [optional!]
# [optional: only used if you need to tweak CB defaults or generate from more than one data file]
# page_gen:
#   - data: 'demo-metadata'
#     template: 'item'
#     name: 'objectid'
#     dir: 'items'
#     extension: 'html' 
#     filter: 'objectid'  

##########
# Site/Organization Branding 
#   Enter information for your organization (replacing the CDIL links and name below) if you'd like to brand your site with a logo
#   To remove the branding, comment out these values, or delete them. 
#
organization-name: "Digital Grinnell"
organization-link: https://www.grinnell.edu/
# used only for the footer logo link (_includes/lib-footer.html); falls back to organization-link if unset
organization-link-libraries: https://www.grinnell.edu/academics/libraries
organization-logo-banner: https://digitalgrinnell-secondary.z19.web.core.windows.net/assets/img/grinnell_logo_primary-red-black.png
organization-logo-nav: https://digitalgrinnell-secondary.z19.web.core.windows.net/assets/img/grinnell_logo_primary-red-black.png
organization-logo-footer: https://digitalgrinnell-secondary.z19.web.core.windows.net/assets/img/grinnell_logo_primary-black.png

##########
# Search
#   Set to true to re-enable the Lunr site search (nav link, quick-search box, and /search/ page).
#   Left false for now since the deployed search still reflects Iowa State's collection.
search-enabled: false

##########
# ROBOTS EXCLUDE
#
# set noindex to true if you do NOT want Google to index your site
# noindex: true 

##########
# BUILD SETTINGS 
#
# Note: use environment variable on build command to include analytics
# JEKYLL_ENV=production jekyll build
# (this is done automatically by gh-pages build)
#
# ignore stuff
exclude: [docs/, Rakefile, rakelib/, README.md, LICENSE, CODEOWNERS, utilities/, objects/]
# compress CSS output
sass:
  style: compressed
  # partials rely on @import's shared global scope (theme vars set in cb.scss
  # before importing _sass/*); migrating to @use/@forward needs a real rewrite
  silence_deprecations: [import]
